# Proxy en el droplet. Sustituye tablero.ejemplo.com por tu dominio.
# La app escucha en 127.0.0.1:3000. Cuando nginx esté activo, cambia el
# puerto de docker-compose a "127.0.0.1:3000:3000" para no exponerlo directo.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kanban
#   sudo ln -s /etc/nginx/sites-available/kanban /etc/nginx/sites-enabled/kanban
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tablero.ejemplo.com

server {
    listen 80;
    server_name tablero.ejemplo.com;

    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
